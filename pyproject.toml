[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "littlecoinapp"
version = "0.1.0"
description = "A CLI for identifying and estimating the value of coins from photos."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.68,<3",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
littlecoinapp = "littlecoinapp.cli:main"

[tool.setuptools.packages.find]
include = ["littlecoinapp*"]
